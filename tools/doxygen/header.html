<script type="text/javascript">
    // Follow the Docusaurus theme when the docs site is the parent.
    try {
        const docusaurusTheme = localStorage.getItem('theme');
        if (docusaurusTheme === 'dark') DoxygenAwesomeDarkModeToggle.userPreference = true;
        else if (docusaurusTheme === 'light') DoxygenAwesomeDarkModeToggle.userPreference = false;
    } catch (e) {}
    DoxygenAwesomeDarkModeToggle.init()
    DoxygenAwesomeFragmentCopyButton.init()
    DoxygenAwesomeParagraphLink.init()
</script>
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var nav = document.getElementById('side-nav');
        var tree = document.getElementById('nav-tree');
        var titlearea = document.getElementById('titlearea');
        if (!nav) return;
        var link = document.createElement('a');
        link.className = 'back-to-docs';
        link.href = '/docs/client/';
        link.textContent = '← Back to docs';
        if (titlearea) {
            titlearea.appendChild(link);
        } else if (tree && tree.parentNode) {
            tree.parentNode.insertBefore(link, tree);
        } else {
            nav.prepend(link);
        }
    });
</script>
